    <script>
      ;(function () {
        var origin = window.location.origin
        var imgs = document.querySelectorAll('meta[property="og:image"], meta[name="twitter:image"]')
        imgs.forEach(function (m) {
          if (m.content && m.content.indexOf('http') !== 0) {
            m.content = origin + m.content
          }
        })
        var url = document.querySelector('meta[property="og:url"]')
        if (!url) {
          url = document.createElement('meta')
          url.setAttribute('property', 'og:url')
          document.head.appendChild(url)
        }
        url.content = window.location.href
      })()
    </script>
